name: Linux-AppImage

on:
- workflow_dispatch

env:
  BUILD_TYPE: Release

jobs:
  Ubuntu-AppImage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add OpenMW PPA Dependencies
      run: sudo add-apt-repository ppa:openmw/openmw; sudo apt-get update

    - name: Install Building Dependencies
      run: |
        sudo CI/install_debian_deps.sh gcc openmw-deps openmw-deps-static
        sudo apt-get install -y libfreetype6-dev

    - name: Prime ccache
      uses: hendrikmuhs/ccache-action@v1
      with:
        key: linux-appimage-${{ env.BUILD_TYPE }}
        max-size: 1000M

    - name: Configure
      run: >
        cmake .
        -D CMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=ON
        -D USE_SYSTEM_TINYXML=ON
        -D BUILD_COMPONENTS_TESTS=ON
        -D BUILD_OPENMW_TESTS=ON
        -D BUILD_OPENCS_TESTS=ON
        -D CMAKE_INSTALL_PREFIX=.
        -D OPENMW_USE_SYSTEM_MYGUI=OFF
        -D MYGUI_STATIC=ON
        -D OPENMW_USE_SYSTEM_OSG=OFF
        -D OSG_STATIC=ON
        -D OPENMW_USE_SYSTEM_RECASTNAVIGATION=OFF
        -D RECASTNAVIGATION_STATIC=ON

    - name: Build
      run: cmake --build . -- -j$(nproc)

    - name: Run components tests
      run: ./components-tests

    - name: Run OpenMW tests
      run: ./openmw-tests

    - name: Run OpenMW-CS tests
      run: ./openmw-cs-tests

    - name: Assemble AppDir
      shell: bash
      run: |
        mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
        cp -r resources AppDir/usr/bin/
        cp defaults.bin AppDir/usr/bin/
        cp gamecontrollerdb.txt AppDir/usr/bin/
        cp openmw.cfg AppDir/usr/bin/
        cp openmw AppDir/usr/bin/
        cp openmw-launcher AppDir/usr/bin/
        cp openmw-cs AppDir/usr/bin/
        cp openmw-wizard AppDir/usr/bin/
        cp openmw-iniimporter AppDir/usr/bin/
        cp openmw-essimporter AppDir/usr/bin/
        cp bsatool AppDir/usr/bin/
        cp esmtool AppDir/usr/bin/
        cp openmw-navmeshtool AppDir/usr/bin/ || true
        cp openmw-bulletobjecttool AppDir/usr/bin/ || true
        cat > AppDir/usr/share/applications/openmw.desktop <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=OpenMW
        GenericName=Role Playing Game
        Comment=An engine replacement for The Elder Scrolls III: Morrowind
        Keywords=Morrowind;Reimplementation Mods;esm;bsa;
        TryExec=openmw
        Exec=openmw
        Icon=openmw
        Categories=Game;RolePlaying;
        StartupWMClass=openmw
        EOF
        cp files/launcher/images/openmw.png AppDir/usr/share/icons/hicolor/256x256/apps/openmw.png

    - name: Download linuxdeploy
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

    - name: Build AppImage
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1
      run: |
        export QMAKE=$(command -v qmake6 || command -v qmake)
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --desktop-file AppDir/usr/share/applications/openmw.desktop \
          --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/openmw.png \
          --executable AppDir/usr/bin/openmw \
          --executable AppDir/usr/bin/openmw-launcher \
          --plugin qt \
          --output appimage

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        path: ./OpenMW*.AppImage
        name: openmw-linux-appimage
